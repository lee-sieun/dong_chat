name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} > diff.txt
          
      - name: Send diff to OpenAI API
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DIFF=$(cat diff.txt)
          RESPONSE=$(jq -n \
            --arg model "gpt-4o-mini" \
            --arg system "당신은 숙련된 코드 리뷰어입니다. PR diff를 보고 개선점, 위험 요소, 코드 스타일 피드백을 제공합니다." \
            --arg user "$DIFF" \
            '{model: $model, messages: [{role: "system", content: $system}, {role: "user", content: $user}]}' |
            curl -s https://api.openai.com/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer '"$OPENAI_API_KEY"'" \
              -d @-)

          echo "$RESPONSE" | jq .
          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          echo "review=$REVIEW" >> $GITHUB_OUTPUT

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "${{ steps.review.outputs.review }}"
